name: vpn_luxe
description: A premium WireGuard VPN client shell with a dark luxury UX.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2
  openvpn_flutter: ^1.3.4
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wireguard/
